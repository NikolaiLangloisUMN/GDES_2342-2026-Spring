<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="container">

    <header>
        <h1>Welcome to Nik.com</h1>
        <h3>Where we go to learn how to make HTML and CSS sing!</h3>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About Me</a>
        <a href="#" class="current-page">Contact Me</a>
    </nav>

    <section class="content">
        <form>
            <div class="columns">
                <div>
                    <div class="inputBlock">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName">
                    </div>

                    <div class="inputBlock">
                        <label for="emailAddress">Email Address</label>
                        <input type="text" id="emailAddress" name="emailAddress">
                    </div>

                    <div class="inputBlock">
                        <label for="contactMethod">Contact Method</label>
                        <select name="contactMethod" id="contactMethod" multiple>
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="inputBlock">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName">
                    </div>

                    <div class="inputBlock">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="text" id="phoneNumber" name="phoneNumber">
                    </div>

                    <div class="inputBlock">
                        <label for="signMeUpFor">Sign me up for...</label>
                        <div class="checkboxes">
                            <div class="checkbox">
                                <input type="checkbox" name="signMeUpFor" value="Newsletter">
                                Newsletter
                            </div>
                            <div class="checkbox">
                                <input type="checkbox" name="signMeUpFor" value="Mailing Lists">
                                Mailing List
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="submit-button">
                <input type="button" value="Submit">
            </div>
        </form>
    </section>

    <footer>
        Footer links go down here
    </footer>

</section>

</body>
</html>
